name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore release key
        env:
          KEYSTORE_BASE64: ${{ secrets.LIVINGROOM_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "LIVINGROOM_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build release APK
        env:
          LIVINGROOM_KEYSTORE_PASSWORD: ${{ secrets.LIVINGROOM_KEYSTORE_PASSWORD }}
          LIVINGROOM_KEY_ALIAS: livingroom
        run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: LivingRoomTV
          path: app/build/outputs/apk/release/app-release.apk
