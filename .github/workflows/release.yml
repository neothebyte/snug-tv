name: Release

# Publishes a signed APK on the Releases page whenever main has a version
# (versionName in app/build.gradle.kts) that doesn't have a release yet.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          code=$(sed -n 's/^ *versionCode = \([0-9]*\)/\1/p' app/build.gradle.kts)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if gh release view "v$name" > /dev/null 2>&1; then
            echo "v$name is already released, nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: steps.version.outputs.exists != 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.exists != 'true'
      - name: Restore release key
        if: steps.version.outputs.exists != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.LIVINGROOM_KEYSTORE_BASE64 }}
        run: |
          # A release must be signed with the shared key, or it won't install over the last one.
          if [ -z "$KEYSTORE_BASE64" ]; then echo "LIVINGROOM_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "LIVINGROOM_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build release APK
        if: steps.version.outputs.exists != 'true'
        env:
          LIVINGROOM_KEYSTORE_PASSWORD: ${{ secrets.LIVINGROOM_KEYSTORE_PASSWORD }}
          LIVINGROOM_KEY_ALIAS: livingroom
        run: |
          ./gradlew assembleRelease
          apk=app/build/outputs/apk/release/app-release.apk
          # Refuse to publish a debug-signed APK.
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          signer=$("$apksigner" verify --print-certs "$apk" | grep -m1 'certificate DN')
          echo "$signer"
          if echo "$signer" | grep -q 'CN=Android Debug'; then echo "APK is debug-signed"; exit 1; fi
          cp "$apk" "Snug-${{ steps.version.outputs.name }}.apk"
      - name: Publish release
        if: steps.version.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          gh release create "v$NAME" "Snug-$NAME.apk" \
            --target "$GITHUB_SHA" \
            --title "Snug $NAME" \
            --notes "Snug for Android TV, version $NAME (build $CODE). Download Snug-$NAME.apk below to install it on the TV box."
