name: Release

# One build per push: on pull requests it builds and signs both APKs and keeps them as artifacts, as a check;
# on main it also publishes them as a GitHub Release whenever the version (versionName in app/build.gradle.kts)
# doesn't have one yet. (Build and Release used to be two workflows doing the same Gradle build twice, which
# burned the account's free Actions minutes at double speed.)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          code=$(sed -n 's/^ *versionCode = \([0-9]*\)/\1/p' app/build.gradle.kts)
          home=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' home/build.gradle.kts)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "home=$home" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "pull_request" ] && gh release view "v$name" > /dev/null 2>&1; then
            echo "v$name is already released, nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: steps.version.outputs.exists != 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.exists != 'true'
      - name: Restore release key
        if: steps.version.outputs.exists != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.LIVINGROOM_KEYSTORE_BASE64 }}
        run: |
          # A release must be signed with the shared key, or it won't install over the last one.
          if [ -z "$KEYSTORE_BASE64" ]; then echo "LIVINGROOM_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "LIVINGROOM_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build release APKs
        if: steps.version.outputs.exists != 'true'
        env:
          LIVINGROOM_KEYSTORE_PASSWORD: ${{ secrets.LIVINGROOM_KEYSTORE_PASSWORD }}
          LIVINGROOM_KEY_ALIAS: livingroom
        run: |
          ./gradlew assembleRelease
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          # Refuse to publish a debug-signed APK.
          for apk in app/build/outputs/apk/release/app-release.apk home/build/outputs/apk/release/home-release.apk; do
            signer=$("$apksigner" verify --print-certs "$apk" | grep -m1 'certificate DN')
            echo "$apk: $signer"
            if echo "$signer" | grep -q 'CN=Android Debug'; then echo "$apk is debug-signed"; exit 1; fi
          done
          cp app/build/outputs/apk/release/app-release.apk "Snug-${{ steps.version.outputs.name }}.apk"
          cp home/build/outputs/apk/release/home-release.apk "SnugHome-${{ steps.version.outputs.home }}.apk"
      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.exists != 'true'
        with:
          name: Snug-${{ steps.version.outputs.name }}
          path: Snug-*.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.exists != 'true'
        with:
          name: SnugHome-${{ steps.version.outputs.home }}
          path: SnugHome-*.apk
          retention-days: 14
      - name: Publish release
        if: steps.version.outputs.exists != 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          gh release create "v$NAME" "Snug-$NAME.apk" SnugHome-*.apk \
            --target "$GITHUB_SHA" \
            --title "Snug $NAME" \
            --notes "Snug for Android TV, version $NAME (build $CODE). Download Snug-$NAME.apk below to install it on the TV box. SnugHome-*.apk is the optional home screen."
